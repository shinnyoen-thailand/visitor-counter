<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Visitor Counter</title>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      
      /* Background Image Settings */
      background-image: url('象さん.jpg');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    /* Main Container */
    .app-container {
      width: 96%;
      height: 92%;
      max-width: 1400px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Counters Layout */
    .counters {
      display: flex;
      flex: 1;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    /* Counter Outer Container (Completely Transparent) */
    .counter-card {
      width: 38%;
      height: 92%;
      background-color: transparent;
      border: none;
      box-shadow: none;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Number Area Wrapper */
    .count-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Count Number (Rounded Capsule Blur Badge) */
    .count {
      font-size: clamp(8rem, 20vh, 16rem);
      font-weight: 800;
      color: #000000;
      line-height: 1;
      padding: 15px 45px;
      background-color: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 60px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      min-width: 220px;
      text-align: center;
    }

    /* Button Area (Targeted Blur around Member/Visitor buttons) */
    .btn-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 16px;
      border-radius: 24px;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.05);
    }

    /* Member & Visitor Buttons */
    .btn-add {
      width: 100%;
      height: 100px;
      border: none;
      border-radius: 18px;
      font-size: 3rem;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.05s, opacity 0.1s;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
    }
    
    .btn-add:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .btn-member {
      background-color: #2563eb;
    }
    .btn-visitor {
      background-color: #059669;
    }

    /* Minus Buttons */
    .btn-sub {
      margin-top: 12px;
      padding: 10px 28px;
      background-color: rgba(229, 231, 235, 0.9);
      border: none;
      border-radius: 10px;
      color: #374151;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-sub:active {
      background-color: rgba(209, 213, 219, 0.95);
    }

    /* Footer Area */
    .footer {
      display: flex;
      justify-content: center;
      padding-bottom: 10px;
    }

    /* Reset Button */
    .btn-reset {
      padding: 14px 40px;
      background-color: rgba(254, 226, 226, 0.85);
      border: 1px solid rgba(248, 113, 113, 0.5);
      border-radius: 30px;
      color: #dc2626;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.06);
      -webkit-touch-callout: none;
      touch-action: none;
    }
    .btn-reset:active {
      background-color: rgba(252, 165, 165, 0.95);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="counters">
      
      <!-- Member Section -->
      <div class="counter-card">
        <div class="count-wrapper">
          <div class="count" id="count-member">0</div>
        </div>
        <div class="btn-area">
          <button class="btn-add btn-member" id="add-member">Member</button>
          <button class="btn-sub" id="sub-member">－</button>
        </div>
      </div>
      
      <!-- Visitor Section -->
      <div class="counter-card">
        <div class="count-wrapper">
          <div class="count" id="count-visitor">0</div>
        </div>
        <div class="btn-area">
          <button class="btn-add btn-visitor" id="add-visitor">Visitor</button>
          <button class="btn-sub" id="sub-visitor">－</button>
        </div>
      </div>
      
    </div>
    
    <div class="footer">
      <button class="btn-reset" id="btn-reset">Hold to Reset</button>
    </div>
    
  </div>

  <script>
    let memberCount = 0;
    let visitorCount = 0;

    const elMemberCount = document.getElementById('count-member');
    const elVisitorCount = document.getElementById('count-visitor');
    const elResetBtn = document.getElementById('btn-reset');

    function updateDisplay() {
      elMemberCount.innerText = memberCount;
      elVisitorCount.innerText = visitorCount;
    }

    // Member Add
    document.getElementById('add-member').addEventListener('touchstart', (e) => {
      e.preventDefault();
      memberCount++;
      updateDisplay();
    });
    document.getElementById('add-member').addEventListener('click', (e) => {
      if (e.detail !== 0) return;
      memberCount++;
      updateDisplay();
    });

    // Member Subtract
    document.getElementById('sub-member').addEventListener('click', () => {
      if (memberCount > 0) {
        memberCount--;
        updateDisplay();
      }
    });

    // Visitor Add
    document.getElementById('add-visitor').addEventListener('touchstart', (e) => {
      e.preventDefault();
      visitorCount++;
      updateDisplay();
    });
    document.getElementById('add-visitor').addEventListener('click', (e) => {
      if (e.detail !== 0) return;
      visitorCount++;
      updateDisplay();
    });

    // Visitor Subtract
    document.getElementById('sub-visitor').addEventListener('click', () => {
      if (visitorCount > 0) {
        visitorCount--;
        updateDisplay();
      }
    });

    // Long Press Reset Logic
    let resetTimer = null;
    const holdTime = 1500;

    function startReset(e) {
      if (e.type === 'touchstart') e.preventDefault();
      elResetBtn.innerText = 'Hold...';
      elResetBtn.style.backgroundColor = 'rgba(252, 165, 165, 1)';
      
      resetTimer = setTimeout(() => {
        memberCount = 0;
        visitorCount = 0;
        updateDisplay();
        alert('Counts have been reset.');
        resetEnd();
      }, holdTime);
    }

    function resetEnd() {
      if (resetTimer) {
        clearTimeout(resetTimer);
        resetTimer = null;
      }
      elResetBtn.innerText = 'Hold to Reset';
      elResetBtn.style.backgroundColor = '';
    }

    elResetBtn.addEventListener('mousedown', startReset);
    elResetBtn.addEventListener('mouseup', resetEnd);
    elResetBtn.addEventListener('mouseleave', resetEnd);

    elResetBtn.addEventListener('touchstart', startReset, { passive: false });
    elResetBtn.addEventListener('touchend', resetEnd);
    elResetBtn.addEventListener('touchcancel', resetEnd);
  </script>
</body>
</html>
