<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>来場者カウンター</title>
  <style>
    /* iOS特有のタップ時のハイライトを無効化 */
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0; /* フォールバック */
      
      /* ★背景画像の設定 */
      background-image: url('象さん.jpg'); /* 同じフォルダに象さん.jpgがある前提 */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      
      /* 文字が選択されないようにする（誤動作防止） */
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    /* 全体のコンテナ */
    .app-container {
      width: 90%;
      height: 90%;
      max-width: 1024px; /* iPad Proなどの大画面用 */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* メインのカウンターエリア（2列並び） */
    .counters {
      display: flex;
      flex: 1;
      gap: 3%; /* 左右のカードの間隔 */
      margin-bottom: 20px;
    }

    /* 各カウンターのカード */
    .counter-card {
      flex: 1;
      /* ★半透明の背景（後ろの絵が見えるように） */
      background-color: rgba(255, 255, 255, 0.5); /* 白色、不透明度50% */
      border-radius: 20px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      /* すりガラス効果を入れるとより綺麗です（iOS Safari対応） */
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    /* カテゴリ名（Member, Visitor） */
    .label {
      font-size: 2.5rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }

    /* カウント数字 */
    .count {
      font-size: 8rem;
      font-weight: 800;
      color: #000;
      line-height: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 大きなカウントアップボタン */
    .btn-add {
      width: 100%;
      height: 25%; /* カードの高さに対して */
      border: none;
      border-radius: 15px;
      font-size: 2.5rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: transform 0.05s, opacity 0.1s;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    }
    
    /* タップ時の視覚効果 */
    .btn-add:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    /* 各ボタンの色 */
    .btn-member {
      background-color: #3B82F6; /* 青色 */
    }
    .btn-visitor {
      background-color: #10B981; /* 緑色 */
    }

    /* 小さなマイナスボタン */
    .btn-sub {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #e0e0e0;
      border: none;
      border-radius: 10px;
      color: #666;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-sub:active {
      background-color: #d0d0d0;
    }

    /* 下部のリセットボタンエリア */
    .footer {
      display: flex;
      justify-content: center;
      padding-bottom: 10px;
    }

    /* リセットボタン（長押し） */
    .btn-reset {
      padding: 15px 40px;
      background-color: rgba(254, 226, 226, 0.8); /* 半透明の赤 */
      border: 1px solid rgba(248, 113, 113, 0.5);
      border-radius: 30px;
      color: #b91c1c; /* 濃い赤 */
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      
      /* iPhone/iPadでタップ時に変な動作をしないようにする */
      -webkit-touch-callout: none;
      touch-action: none;
    }
    .btn-reset:active {
      background-color: rgba(252, 165, 165, 0.9);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- カウンターエリア -->
    <div class="counters">
      
      <!-- Memberのカード -->
      <div class="counter-card">
        <div class="label">Member</div>
        <div class="count" id="count-member">0</div>
        <!-- ★「＋」を削除した大きなボタン -->
        <button class="btn-add btn-member" id="add-member">Member</button>
        <!-- 小さなマイナスボタン -->
        <button class="btn-sub" id="sub-member">－</button>
      </div>
      
      <!-- Visitorのカード -->
      <div class="counter-card">
        <div class="label">Visitor</div>
        <div class="count" id="count-visitor">0</div>
        <!-- ★「＋」を削除した大きなボタン -->
        <button class="btn-add btn-visitor" id="add-visitor">Visitor</button>
        <!-- 小さなマイナスボタン -->
        <button class="btn-sub" id="sub-visitor">－</button>
      </div>
      
    </div>
    
    <!-- 下部エリア -->
    <div class="footer">
      <button class="btn-reset" id="btn-reset">Hold to Reset</button>
    </div>
    
  </div>

  <script>
    // 状態管理（カウント数）
    let memberCount = 0;
    let visitorCount = 0;

    // 画面要素の取得
    const elMemberCount = document.getElementById('count-member');
    const elVisitorCount = document.getElementById('count-visitor');
    const elResetBtn = document.getElementById('btn-reset');

    // 画面表示を更新する関数
    function updateDisplay() {
      elMemberCount.innerText = memberCount;
      elVisitorCount.innerText = visitorCount;
    }

    // --- カウント処理 ---

    // Member +
    document.getElementById('add-member').addEventListener('touchstart', (e) => {
      e.preventDefault(); // 連打時のダブルタップズーム防止
      memberCount++;
      updateDisplay();
    });

    // Member - (誤カウント修正用)
    document.getElementById('sub-member').addEventListener('click', () => {
      if (memberCount > 0) {
        memberCount--;
        updateDisplay();
      }
    });

    // Visitor +
    document.getElementById('add-visitor').addEventListener('touchstart', (e) => {
      e.preventDefault();
      visitorCount++;
      updateDisplay();
    });

    // Visitor - (誤カウント修正用)
    document.getElementById('sub-visitor').addEventListener('click', () => {
      if (visitorCount > 0) {
        visitorCount--;
        updateDisplay();
      }
    });

    // --- リセット処理（長押し） ---
    
    let resetTimer = null;
    const holdTime = 1500; // 1.5秒長押し

    // 長押し開始
    function startReset(e) {
      if (e.type === 'touchstart') e.preventDefault();
      elResetBtn.innerText = 'Hold...';
      elResetBtn.style.backgroundColor = 'rgba(252, 165, 165, 1)'; // 色を濃くする
      
      resetTimer = setTimeout(() => {
        // カウントをリセット
        memberCount = 0;
        visitorCount = 0;
        updateDisplay();
        alert('カウントをリセットしました');
        resetEnd(); // 終了処理
      }, holdTime);
    }

    // 長押し中断・終了
    function resetEnd() {
      if (resetTimer) {
        clearTimeout(resetTimer);
        resetTimer = null;
      }
      elResetBtn.innerText = 'Hold to Reset';
      elResetBtn.style.backgroundColor = ''; // 元の色に戻す
    }

    // マウスとタッチ両方に対応
    elResetBtn.addEventListener('mousedown', startReset);
    elResetBtn.addEventListener('mouseup', resetEnd);
    elResetBtn.addEventListener('mouseleave', resetEnd);

    elResetBtn.addEventListener('touchstart', startReset, { passive: false });
    elResetBtn.addEventListener('touchend', resetEnd);
    elResetBtn.addEventListener('touchcancel', resetEnd);

  </script>
</body>
</html>
