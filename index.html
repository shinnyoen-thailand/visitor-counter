<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>来場者カウンター</title>
  <style>
    /* iOS特有のタップハイライトや不要なジェスチャーを全カット */
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      
      background-image: url('象さん.jpg');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      
      overflow: hidden;
      touch-action: manipulation;
    }

    /* Main Container */
    .app-container {
      width: 96%;
      height: 92%;
      max-width: 1400px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Counters Layout */
    .counters {
      display: flex;
      flex: 1;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    /* Counter Outer Container */
    .counter-card {
      width: 38%;
      height: 92%;
      background-color: transparent;
      border: none;
      box-shadow: none;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Number Area Wrapper */
    .count-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      pointer-events: none;
    }

    /* Count Number */
    .count {
      font-size: clamp(8rem, 20vh, 16rem);
      font-weight: 800;
      color: #000000;
      line-height: 1;
      padding: 15px 45px;
      background-color: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 60px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      min-width: 220px;
      text-align: center;
      pointer-events: auto;
    }

    /* Button Area */
    .btn-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 16px;
      border-radius: 24px;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.05);
    }

    /* Member & Visitor Buttons */
    .btn-add {
      width: 100%;
      height: 100px;
      border: none;
      border-radius: 18px;
      font-size: 3rem;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.05s, opacity 0.1s;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
      touch-action: manipulation;
    }
    
    .btn-add:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .btn-member {
      background-color: #2563eb;
    }
    .btn-visitor {
      background-color: #059669;
    }

    /* Minus Buttons */
    .btn-sub {
      margin-top: 12px;
      padding: 10px 28px;
      background-color: rgba(229, 231, 235, 0.9);
      border: none;
      border-radius: 10px;
      color: #374151;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-sub:active {
      background-color: rgba(209, 213, 219, 0.95);
    }

    /* Footer Area */
    .footer {
      display: flex;
      justify-content: center;
      padding-bottom: 10px;
    }

    /* Reset Button */
    .btn-reset {
      padding: 14px 40px;
      background-color: rgba(254, 226, 226, 0.85);
      border: 1px solid rgba(248, 113, 113, 0.5);
      border-radius: 30px;
      color: #dc2626;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.06);
      -webkit-touch-callout: none;
      touch-action: none;
    }
    .btn-reset:active {
      background-color: rgba(252, 165, 165, 0.95);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="counters">
      
      <!-- Member Section -->
      <div class="counter-card">
        <div class="count-wrapper">
          <div class="count" id="count-member">0</div>
        </div>
        <div class="btn-area">
          <button class="btn-add btn-member" id="add-member" ontouchstart="handleCount('member', event)">Member</button>
          <button class="btn-sub" id="sub-member" onclick="handleSub('member')">－</button>
        </div>
      </div>
      
      <!-- Visitor Section -->
      <div class="counter-card">
        <div class="count-wrapper">
          <div class="count" id="count-visitor">0</div>
        </div>
        <div class="btn-area">
          <button class="btn-add btn-visitor" id="add-visitor" ontouchstart="handleCount('visitor', event)">Visitor</button>
          <button class="btn-sub" id="sub-visitor" onclick="handleSub('visitor')">－</button>
        </div>
      </div>
      
    </div>
    
    <div class="footer">
      <button class="btn-reset" id="btn-reset">Hold to Reset</button>
    </div>
    
  </div>

  <script>
    let memberCount = 0;
    let visitorCount = 0;

    const elMemberCount = document.getElementById('count-member');
    const elVisitorCount = document.getElementById('count-visitor');
    const elResetBtn = document.getElementById('btn-reset');

    // 🎵 音声ファイルの読み込み（「決定ボタンを押す53.mp3」を使用）
    const clickSound = new Audio('決定ボタンを押す53.mp3');

    // 連打時に音が切れずに高速再生されるよう最適化
    function playMp3Sound() {
      try {
        clickSound.currentTime = 0; // 毎回再生位置を0秒に戻す
        const playPromise = clickSound.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => console.log('Audio play error:', error));
        }
      } catch (e) {
        console.error(e);
      }
    }

    function updateDisplay() {
      elMemberCount.innerText = memberCount;
      elVisitorCount.innerText = visitorCount;
    }

    // 🚀 最速カウントアップ処理（`ontouchstart` 対応でサクサク動作）
    function handleCount(type, event) {
      if (event) {
        event.preventDefault(); // iOSのダブルタップズームや長押しメニューの遅延を完全にブロック
      }

      playMp3Sound(); // 音を鳴らす

      if (type === 'member') {
        memberCount++;
      } else if (type === 'visitor') {
        visitorCount++;
      }
      updateDisplay();
    }

    // PC等でクリックされた場合のフォールバック（タッチ対応端末でない場合）
    document.getElementById('add-member').addEventListener('click', (e) => {
      if (e.detail !== 0) { // タッチで既に動いている場合は2重実行しない
        handleCount('member', null);
      }
    });
    document.getElementById('add-visitor').addEventListener('click', (e) => {
      if (e.detail !== 0) {
        handleCount('visitor', null);
      }
    });

    // ➖ マイナスボタン処理
    function handleSub(type) {
      if (type === 'member' && memberCount > 0) {
        memberCount--;
      } else if (type === 'visitor' && visitorCount > 0) {
        visitorCount--;
      }
      updateDisplay();
    }

    // 🛑 リセット長押し処理（1.5秒）
    let resetTimer = null;
    const holdTime = 1500;

    function startReset(e) {
      if (e.type === 'touchstart') {
        if (e.cancelable) e.preventDefault();
      }
      elResetBtn.innerText = 'Hold...';
      elResetBtn.style.backgroundColor = 'rgba(252, 165, 165, 1)';
      
      resetTimer = setTimeout(() => {
        memberCount = 0;
        visitorCount = 0;
        updateDisplay();
        alert('Counts have been reset.');
        resetEnd();
      }, holdTime);
    }

    function resetEnd() {
      if (resetTimer) {
        clearTimeout(resetTimer);
        resetTimer = null;
      }
      elResetBtn.innerText = 'Hold to Reset';
      elResetBtn.style.backgroundColor = '';
    }

    elResetBtn.addEventListener('mousedown', startReset);
    elResetBtn.addEventListener('mouseup', resetEnd);
    elResetBtn.addEventListener('mouseleave', resetEnd);

    elResetBtn.addEventListener('touchstart', startReset, { passive: false });
    elResetBtn.addEventListener('touchend', resetEnd);
    elResetBtn.addEventListener('touchcancel', resetEnd);
  </script>
</body>
</html>
